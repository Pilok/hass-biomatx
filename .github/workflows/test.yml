name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  pytest:
    name: pytest on Python 3.14, serialx ${{ matrix.serialx }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10.0 is what requirements_dev.txt pins and Home Assistant 2026.9
        # constrains; 1.11.0 is what Home Assistant 2026.10 constrains.
        serialx: ["1.10.0", "1.11.0"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements_dev.txt
      - name: Install the serialx version under test
        env:
          SERIALX_VERSION: ${{ matrix.serialx }}
        run: python -m pip install "serialx==${SERIALX_VERSION}"
      - name: Check the serialx version under test
        env:
          SERIALX_VERSION: ${{ matrix.serialx }}
        run: >-
          python -c "import importlib.metadata as m, os;
          v = m.version('serialx');
          assert v == os.environ['SERIALX_VERSION'], v"
      - name: Run the test suite
        run: python -m pytest
