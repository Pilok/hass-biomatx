name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      # Fails, and so publishes nothing, unless manifest.json declares the tag
      # without its "v" and CHANGELOG.md has a section for that version.
      - name: Check the tag and extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a pre-release part (1.0.0-rc.1) is a pre-release.
          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$prerelease"
